repos:
  - repo: local
    hooks:
      - id: status-documentacao
        name: Verificar tabelas de status
        entry: uv run scripts/gerar_status.py --check
        language: system
        pass_filenames: false
        files: ^(status\.toml|scripts/gerar_status\.py|README\.md|docs/index\.qmd)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/.*/samples/
      - id: end-of-file-fixer
        exclude: ^tests/.*/samples/
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^tests/.*/samples/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --config, ruff.toml]
        files: ^(src|tests)/.*\.py$

  - repo: local
    hooks:
      - id: lint-policy
        name: Conferir política de lint e dispensas temporárias
        entry: python scripts/check_lint_policy.py
        language: python
        additional_dependencies: [ruff==0.15.12]
        pass_filenames: false
        always_run: true
      - id: complexity
        name: Conferir complexidade (Lizard e Complexipy)
        entry: python scripts/check_complexity.py
        language: python
        additional_dependencies: [lizard==1.23.0, complexipy==6.0.1]
        pass_filenames: false
        files: ^src/.*\.py$
      # Suíte offline inteira em paralelo (~30 s numa máquina de 6 núcleos). Roda
      # em todo commit porque há testes de docs, workflows e CLAUDE.md, não só de
      # código.
      # Dentro do hook o git exporta GIT_DIR e GIT_INDEX_FILE; sem o unset, os
      # testes que criam repositórios temporários (gates de lint, complexidade e
      # CI) gravariam commits e refs no repositório de quem está commitando.
      - id: pytest
        name: Rodar a suíte offline (pytest em paralelo)
        entry: bash -c 'unset $(git rev-parse --local-env-vars); exec uv run pytest -n auto'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--line-length=120", "--multi-line=3", "--trailing-comma"]

  - repo: https://github.com/pycqa/pylint
    rev: v3.0.0
    hooks:
      - id: pylint
        args: ["--max-line-length=120"]
        files: ^(src|scripts)/.*\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings==1.7.0]
        args:
          - '--max-line-length=120'
          - '--extend-ignore=E203,W503,D100,D104,D107,D200,D205,D209,D400,D401,D403,E231'
          - '--per-file-ignores=tests/*:D100,D101,D102,D103,D104,E302,E303,F401'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests==2.33.0.20261006, types-PyYAML==6.0.12.20260906]
        args: [--ignore-missing-imports]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^src/.*\.py$
