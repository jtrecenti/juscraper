name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Todo comando uv do workflow usa o uv.lock como está; sem isto, um uv run
  # refaz a resolução quando o pyproject.toml muda sem o lock e instala fora dele.
  UV_FROZEN: "1"

# Em PR, um push novo cancela a execução anterior do mesmo PR. Em push para a
# main o grupo é o próprio commit, então nenhuma execução é cancelada.
concurrency:
  group: testes-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # `cobertura` fica fora da lista acima de propósito: se a chave já
        # existisse na matriz, este include criaria uma perna a mais em vez de
        # anotar a de 3.13.
        include:
          - python: "3.13"
            cobertura: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: uv.lock
      - name: Instalar dependências de desenvolvimento
        run: uv sync --frozen --extra dev
      # -n auto: um worker por núcleo do runner, como no hook pytest local; o
      # pytest-cov junta a cobertura dos workers antes de aplicar o piso.
      - name: Rodar a suíte offline
        if: ${{ !matrix.cobertura }}
        run: uv run pytest -n auto
      - name: Rodar a suíte offline com cobertura
        if: ${{ matrix.cobertura }}
        run: uv run pytest -n auto --cov --cov-report=
      # Publica também quando o piso reprova o passo anterior, que é quando a
      # tabela por arquivo mais serve; --fail-under=0 impede que o próprio
      # relatório saia com erro antes de escrever.
      - name: Publicar a cobertura no resumo da execução
        if: ${{ matrix.cobertura && !cancelled() }}
        run: |
          total="$(uv run coverage report --format=total --fail-under=0)"
          {
            echo "## Cobertura da suíte offline: ${total}%"
            echo
            echo "<details><summary>Por arquivo</summary>"
            echo
            uv run coverage report --format=markdown --fail-under=0
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # O pyproject.toml aceita pandas>=2.0.0, mas o lock instala o pandas mais novo,
  # e as pernas acima nunca rodam o piso. Esta perna troca o pandas do lock pela
  # série do piso e roda a suíte offline. O pandas 2.0 só tem wheel até o Python
  # 3.11 e foi compilado contra o NumPy 1, que fica abaixo de 2 no mesmo passo.
  pytest-piso-pandas:
    name: pytest (py3.11, piso do pandas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          cache-dependency-glob: uv.lock
      - name: Instalar dependências de desenvolvimento
        run: uv sync --frozen --extra dev
      - name: Trocar o pandas do lock pelo piso
        run: uv pip install "pandas==2.0.*" "numpy<2"
      # --no-sync: sem ele, o uv run reinstalaria o pandas do lock.
      - name: Rodar a suíte offline com o piso do pandas
        run: uv run --no-sync pytest -n auto

  # Check obrigatório é casado pelo nome do job. Este job dá um nome só para o
  # resultado de todas as pernas bloqueantes, que não muda quando a matriz muda.
  obrigatorios:
    name: Testes obrigatórios
    if: always()
    needs: [pytest, pytest-piso-pandas]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o resultado de todas as pernas
        env:
          RESULTADO: ${{ needs.pytest.result }}
          RESULTADO_PISO: ${{ needs.pytest-piso-pandas.result }}
        run: |
          echo "pytest: $RESULTADO"
          echo "pytest com o piso do pandas: $RESULTADO_PISO"
          test "$RESULTADO" = "success"
          test "$RESULTADO_PISO" = "success"
