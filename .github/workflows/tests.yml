name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Todo comando uv do workflow usa o uv.lock como está; sem isto, um uv run
  # refaz a resolução quando o pyproject.toml muda sem o lock e instala fora dele.
  UV_FROZEN: "1"

# Em PR, um push novo cancela a execução anterior do mesmo PR. Em push para a
# main o grupo é o próprio commit, então nenhuma execução é cancelada.
concurrency:
  group: testes-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # `cobertura` fica fora da lista acima de propósito: se a chave já
        # existisse na matriz, este include criaria uma perna a mais em vez de
        # anotar a de 3.13.
        include:
          - python: "3.13"
            cobertura: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: uv.lock
      - name: Instalar dependências de desenvolvimento
        run: uv sync --frozen --extra dev
      - name: Rodar a suíte offline
        if: ${{ !matrix.cobertura }}
        run: uv run pytest
      - name: Rodar a suíte offline com cobertura
        if: ${{ matrix.cobertura }}
        run: uv run pytest --cov --cov-report=
      # Publica também quando o piso reprova o passo anterior, que é quando a
      # tabela por arquivo mais serve; --fail-under=0 impede que o próprio
      # relatório saia com erro antes de escrever.
      - name: Publicar a cobertura no resumo da execução
        if: ${{ matrix.cobertura && !cancelled() }}
        run: |
          total="$(uv run coverage report --format=total --fail-under=0)"
          {
            echo "## Cobertura da suíte offline: ${total}%"
            echo
            echo "<details><summary>Por arquivo</summary>"
            echo
            uv run coverage report --format=markdown --fail-under=0
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Check obrigatório é casado pelo nome do job. Este job dá um nome só para o
  # resultado de todas as pernas bloqueantes, que não muda quando a matriz muda.
  obrigatorios:
    name: Testes obrigatórios
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o resultado de todas as pernas
        env:
          RESULTADO: ${{ needs.pytest.result }}
        run: |
          echo "pytest: $RESULTADO"
          test "$RESULTADO" = "success"
