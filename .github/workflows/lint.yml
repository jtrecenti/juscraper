name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências de desenvolvimento
        run: uv sync --extra dev --python 3.12
      - name: Conferir Ruff e dispensas temporárias
        env:
          # Num PR, a base é a ponta atual da branch de destino: o
          # pull_request.base.sha do evento fica no commit em que o PR foi aberto,
          # e a comparação atribuiria ao PR as dispensas que a main ganhou depois.
          # Em push para a main, before é a ponta anterior.
          LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          uv run ruff check --config ruff.toml src tests
          uv run python scripts/check_lint_policy.py --base-ref "$LINT_BASE"
      - name: Testar a política de lint
        run: uv run pytest tests/lint_policy -q
