# Régua estrita deste módulo, acima da config da raiz. A política de lint do
# repositório inteiro é discutida à parte; aqui a régua vale só neste diretório.
extend = "../../../../pyproject.toml"

[lint]
extend-select = [
    "BLE", "TRY", "ARG", "ERA", "T20", "DTZ", "SLF", "S", "ANN", "D", "FBT", "PL", "PT",
]
ignore = [
    # Mensagem longa na exceção é o padrão do projeto (mensagens em pt-BR com contexto).
    "TRY003",
    # Números mágicos em status HTTP e limites de página são legíveis no lugar.
    "PLR2004",
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
# `**kwargs: Any` repassa parâmetros validados pelo schema pydantic.
allow-star-arg-any = true
